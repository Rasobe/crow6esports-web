allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true

# Los paquetes de analítica de Vercel declaran Next.js como peer opcional; esta web no lo usa
autoInstallPeers: false

# Parches de seguridad en dependencias internas de Astro y del adaptador de Vercel
overrides:
  zod@^4: ^4.6.7
  undici@^8: ^8.12.2
  brace-expansion@^5: ^5.0.11
  # astro 7.4.11 arrastra una beta de @emnapi/runtime que no es compatible con @emnapi/core 1.x
  # y rompe `astro check`; se fija a la versión estable que ya usaba el resto del árbol
  '@emnapi/runtime': 1.11.3
